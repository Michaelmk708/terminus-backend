services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: terminus-backend:latest
    container_name: terminus_backend_api
    # ADD THIS LINE TO FORCE UVICORN TO LISTEN EXTERNALLY
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://terminus_user:terminus_pass@db:5432/terminus_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - DEBUG=True
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: terminus-backend:latest
    container_name: terminus_backend_worker
    command: /opt/venv/bin/celery -A app.core.celery_app.celery_app worker --loglevel=info
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://terminus_user:terminus_pass@db:5432/terminus_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: terminus_backend_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: terminus_db
      POSTGRES_USER: terminus_user
      POSTGRES_PASSWORD: terminus_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terminus_user -d terminus_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: terminus_backend_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
